# ============================================================
#  Bybit Trading Bot - Configuration
#  All monetary values are in Philippine Peso (PHP / ₱).
#  The bot automatically converts to USDT using the live
#  USD/PHP exchange rate fetched from the internet.
# ============================================================

bybit:
  api_key: "YOUR_API_KEY"          # Set via .env or here
  api_secret: "YOUR_API_SECRET"    # Set via .env or here
  testnet: false                   # true = testnet, false = live
  category: "linear"               # linear = USDT perpetuals (derivatives)

trading:
  mode: "live"                     # live | demo | backtest

  # ── Position sizing (in Philippine Peso ₱) ──────────────────────────────
  # The bot converts this to USDT at the live exchange rate before placing orders.
  # Example: ₱2,800 ÷ ~56 = ~$50 USDT per trade
  position_size_php: 2800          # ₱ per trade (≈ $50 at ~₱56/$1)

  max_open_positions: 5            # max concurrent positions

  # ── Leverage ─────────────────────────────────────────────────────────────
  # The bot will use the LOWER of:
  #   a) This configured value
  #   b) The maximum leverage Bybit allows for that specific symbol
  # Example: if BTCUSDT max is 100x and you set 30, bot uses 30x.
  #          if XYZUSDT max is  10x and you set 30, bot uses 10x.
  leverage: 30                     # your desired leverage (bot caps at symbol max)

  # ── TP / SL (as % of ROI — Return on Investment, i.e. on your margin) ───
  # This matches how Bybit displays P&L on the position page.
  # ROI % = PnL / (position_size / leverage)
  # Example at 30x leverage:
  #   TP ROI  = 60% → price only needs to move 2% in your favour  (60 / 30)
  #   SL ROI  = 30% → price only needs to move 1% against you     (30 / 30)
  take_profit_roi_pct: 60.0        # close trade when ROI reaches +60%
  stop_loss_roi_pct:   30.0        # close trade when ROI reaches -30%

  trailing_stop: true              # enable trailing stop
  trailing_stop_activation_pct: 1.0   # activate after +1% price move in our favour
  trailing_stop_callback_pct: 0.5     # trail price by 0.5%

  risk_per_trade_pct: 1.0          # % of balance to risk per trade (for position sizing)

scanner:
  interval_seconds: 5              # how often to re-scan all pairs
  candle_limit: 300                # number of candles to fetch per symbol
  timeframes:                      # timeframes to use for strategy selection
    - "15"                         # 15-minute
    - "60"                         # 1-hour
    - "240"                        # 4-hour
  primary_timeframe: "15"          # timeframe used for live signals
  min_volume_usdt: 1000000         # minimum 24h volume filter (1M USDT)
  blacklist:                       # symbols to skip
    - "USDCUSDT"

backtest:
  enabled: true
  candle_limit: 500                # candles to use for backtest
  timeframe: "15"                  # timeframe for backtest
  min_trades: 10                   # minimum trades for valid backtest
  min_win_rate: 0.45               # 45% minimum win rate
  min_profit_factor: 1.3           # profit factor threshold

strategies:
  # Enable/disable individual strategies
  ema_cross: true
  rsi_reversal: true
  macd_momentum: true
  bollinger_bands: true
  supertrend: true
  ichimoku: true
  vwap_deviation: true
  donchian_breakout: true
  adx_dmi: true
  squeeze_momentum: true
  funding_rate: true
  multi_factor: true

logging:
  level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "logs/bot.log"
  max_log_size_mb: 10
  backup_count: 14

demo:
  # Virtual starting balance in Philippine Peso ₱
  initial_balance_php: 560000      # ₱560,000 ≈ $10,000 USDT
  show_chart: true
  update_interval: 1               # seconds between demo updates
